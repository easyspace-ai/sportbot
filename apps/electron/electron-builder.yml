appId: com.polylzz.electron-shell
productName: PolyBot
copyright: Copyright © 2026

electronVersion: "39.2.7"

# Optional macOS bundle tweak (see apps/electron/scripts/afterPack.cjs — craft pattern).
afterPack: scripts/afterPack.cjs

directories:
  output: release
  buildResources: build

files:
  - dist/main.cjs
  - dist/preload.cjs
  - package.json
  - "!node_modules/**/*"

extraMetadata:
  main: dist/main.cjs

asar: true

extraResources:
  - from: resources/backend
    to: backend
    filter:
      - "**/*"
  - from: resources/dashboard
    to: dashboard
    filter:
      - "**/*"

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: "${productName}-${arch}.${ext}"

dmg:
  title: "PolyBot"

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-${arch}.${ext}"

nsis:
  oneClick: true
  perMachine: false
  include: installer.nsh

linux:
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: "${productName}-${arch}.${ext}"
