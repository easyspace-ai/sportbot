version: '3.9'

services:
  bot:
    image: oven/bun:1-alpine
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - '3001:3001'
    command: sh -c "bun install && bun run --filter bot dev"

  dashboard:
    image: oven/bun:1-alpine
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - '5173:5173'
    command: sh -c "bun install && bun run --filter dashboard dev -- --host 0.0.0.0"

  dashboard-public:
    image: oven/bun:1-alpine
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - '5174:5174'
    environment:
      - VITE_PUBLIC_MODE=true
    command: sh -c "bun install && bun run --filter dashboard dev:public -- --host 0.0.0.0"
